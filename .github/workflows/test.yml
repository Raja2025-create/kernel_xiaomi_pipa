name: Kernel Build Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dummy file
        run: |
          mkdir -p out/test
          echo "Hello Kernel" > out/test/Image.gz-dtb

      - name: Upload dummy artifact
        uses: actions/upload-artifact@v3
        with:
          name: test-kernel
          path: out/test/Image.gz-dtb
          
